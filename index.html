<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Day in the Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0710;--panel:#1d1426;--panel2:#2b1f38;--line:#5a3f78;--verb:#9fd6ff;--verbOn:#ffe14a;--text:#f2ead8;--narr:#ffd83a;--mag:#ffffff;--cat:#ffa64a;--tv:#9cff9c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0710}}
:root[data-theme="dark"]{--bg:#0b0710}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Press Start 2P',monospace}
#app{position:relative;max-width:1280px;margin:0 auto;padding:12px 16px;user-select:none;-webkit-user-select:none;min-height:520px}
#stage{position:relative;width:100%;overflow:hidden;background:#000;border:3px solid var(--line);border-bottom:none;cursor:crosshair}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;transition:filter .6s}
#stage.shake{animation:shake .35s linear 2}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,-2px)}}
#speech{position:absolute;pointer-events:none;text-align:center;font-size:clamp(10px,2vw,20px);line-height:1.55;max-width:84%;padding:.55em .8em;background:rgba(8,4,14,.82);border:3px solid currentColor;box-shadow:0 0 0 2px #000,4px 4px 0 2px rgba(0,0,0,.6);text-shadow:2px 2px 0 #000;display:none;animation:pop .15s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:scale(1);opacity:1}}
#title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:0 8%;color:var(--narr);font-size:clamp(12px,3.6vw,30px);line-height:1.6;opacity:0;transition:opacity 1.4s;pointer-events:none;text-shadow:3px 3px 0 #6a2a00}
#title small{display:block;color:#fff;font-size:.55em;margin-top:1em;text-shadow:2px 2px 0 #000}
#fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .35s;pointer-events:none}
#check{position:absolute;top:8px;right:8px;background:rgba(20,12,28,.95);border:3px solid var(--line);padding:10px 12px;font-size:clamp(7px,1.4vw,11px);line-height:2;display:none;cursor:default}
#check h3{margin:8px 0 2px;color:#c9a6ff;font-size:.85em}
#check .goal{color:#ffcf3a;font-size:1.15em;line-height:1.6;padding-bottom:8px;border-bottom:2px solid #8a6a1a;text-shadow:2px 2px 0 #5a3a00;max-width:34em}
#check .goal.done{color:#7dff8a;border-color:#3a7a3a}
#check .ok{color:#7dff8a;text-decoration:line-through}
#sentence{background:#000;border-left:3px solid var(--line);border-right:3px solid var(--line);color:#c9a6ff;font-size:clamp(7px,1.5vw,12px);padding:8px;text-align:center;min-height:2.6em}
#ui{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;background:var(--panel);border:3px solid var(--line);border-top:none;padding:10px}
#left{display:flex;flex-direction:column;gap:6px}
#verbs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font-family:inherit;cursor:pointer}
#verbs button{background:var(--panel2);color:var(--verb);border:2px solid #3b2b50;font-size:clamp(7px,1.6vw,13px);padding:10px 4px}
#verbs button.on{color:var(--verbOn);border-color:var(--verbOn)}
#checkBtn{background:#2a3a20;color:#c8ff9a;border:2px solid #4a6a30;font-size:clamp(7px,1.4vw,11px);padding:8px}
#right{display:flex;flex-direction:column;gap:6px}
#inv{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;flex:1}
.slot{position:relative;background:#0e0914;border:2px dashed #2a2038;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:2px}
.slot.has{background:radial-gradient(circle,#3a2c58 0%,#221832 75%);border:2px solid #9fd6ff;box-shadow:inset 0 0 6px rgba(159,214,255,.35);cursor:pointer;transition:transform .1s}
.slot.has:hover{transform:translateY(-2px);border-color:#fff}
.slot.sel{border-color:var(--verbOn)!important;box-shadow:0 0 10px var(--verbOn),inset 0 0 8px rgba(255,225,74,.5);animation:selp 1s infinite alternate}
@keyframes selp{to{box-shadow:0 0 3px var(--verbOn),inset 0 0 3px rgba(255,225,74,.3)}}
.slot.used{background:#120e16;border:2px solid #3a3440;box-shadow:none}
.slot.used canvas{filter:grayscale(1) brightness(.6);opacity:.4}
.slot.used::after{content:'✓';position:absolute;right:3px;bottom:1px;color:#7dff8a;font-size:clamp(8px,1.4vw,12px);text-shadow:1px 1px 0 #000}
.slot canvas{width:100%;height:100%;image-rendering:pixelated}
#sndBtn{background:#20304a;color:var(--text);border:2px solid var(--line);font-size:clamp(7px,1.4vw,11px);padding:6px}
#menuBtn{background:#3a2050;color:var(--text);border:2px solid var(--line);font-size:clamp(7px,1.4vw,11px);padding:6px}
#menu{position:absolute;inset:0;background:rgba(5,2,10,.96);display:none;justify-content:center;align-items:flex-start;z-index:10;padding:16px;overflow:auto}
#menu .box{background:var(--panel);border:3px solid var(--line);max-width:620px;width:100%;padding:18px;font-size:clamp(7px,1.6vw,11px);line-height:1.8}
#menu h1{color:var(--narr);font-size:clamp(12px,3vw,20px);text-align:center;margin:0 0 16px}
#menu h2{color:var(--verb);font-size:1em;margin:18px 0 8px;border-top:2px solid #3b2b50;padding-top:14px}
#menu .btns{display:flex;flex-direction:column;gap:8px}
#menu .btns button,#menu .pw button{background:var(--panel2);color:var(--verbOn);border:2px solid var(--line);padding:12px;font-size:inherit}
#menu .pw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#menu input{font-family:inherit;font-size:inherit;padding:10px;background:#000;color:var(--verbOn);border:2px solid var(--line);text-transform:uppercase;flex:1;min-width:120px}
#menu table{width:100%;border-collapse:collapse;margin-top:10px}
#menu td,#menu th{border:1px solid #3b2b50;padding:6px;text-align:left;vertical-align:top}
#menu th{color:var(--verb)}
#menu b{color:var(--verbOn)}
.msg{color:#ff8a8a;min-height:1.5em}
.note{color:#a99bb8}
@media (max-width:560px){#ui{grid-template-columns:1fr}}
</style>
</head><body>

<div id="app">
  <div id="stage"><canvas id="cv" width="320" height="144"></canvas><div id="speech"></div><div id="title"></div><div id="check"></div><div id="fade"></div></div>
  <div id="sentence">&nbsp;</div>
  <div id="ui">
    <div id="left">
      <div id="verbs">
        <button data-v="ouvrir">Ouvrir</button><button data-v="examiner">Examiner</button>
        <button data-v="prendre">Prendre</button><button data-v="utiliser">Utiliser</button>
      </div>
      <button id="checkBtn">Liste</button>
    </div>
    <div id="right"><div id="inv"></div><button id="menuBtn">Menu · Mots de passe</button><button id="sndBtn">Son : ON</button></div>
  </div>
  <div id="menu"><div class="box" id="menuBox"></div></div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=320,H=144,KEY='magali_dotl_save_v2';
const $=id=>document.getElementById(id);
const stage=$('stage'),speechEl=$('speech'),titleEl=$('title'),fadeEl=$('fade'),sentEl=$('sentence'),invEl=$('inv'),menuEl=$('menu'),menuBox=$('menuBox'),checkEl=$('check');

/* ---------- état ---------- */
function defF(){return{armoire:false,kimono:false,robe:false,laser:false,cat:false,catWhite:false,catOnBar:false,mouseGone:false,
  dark:false,bath:false,dressed:false,serviette:false,cushion:false,phone:false,tvOn:false,tv:0,book:0,catTalk:0,scratch:false,used:{},
  tShaggy:false,tCouloir:false,bust:false,litter:false,cheese:false,tCafe:false,tHabit:false,tPhone:false,tWork:false}}
function defState(){return{room:'chambre',x:205,y:130,inv:[],started:false,f:defF()}}
let S=defState();
function save(){S.x=Math.round(P.x);S.y=Math.round(P.y);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadSave(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.started)return d}catch(e){}return null}

const ITEMS={kimono:'kimono',laser:'laser',chat:'Shaggy',robe:'robe bleue',serviette:'serviette',coussin:'coussin',telephone:'téléphone',fromage:'fromage',clems:'clémentines'};
const TASKS=[['tShaggy','Faire prendre un bain à Shaggy'],['tCafe','Prendre un café'],['tHabit',"S'habiller"],['tPhone','Trouver son téléphone'],['tCouloir','Nettoyer le couloir'],['tMatou','Distraire le matou squatteur qui dort dans le salon'],['tWork','Aller au travail']];
const CODES={
  REVEIL:{room:'chambre',label:'Chambre',inv:[],f:{}},
  KIMONO:{room:'couloir',label:'Couloir',inv:['laser','robe'],f:{laser:true,robe:true,armoire:true}},
  PACHA:{room:'bain',label:'Salle de bain',inv:['laser','robe','chat'],f:{laser:true,robe:true,armoire:true,cat:true}},
  CAFE:{room:'salon',label:'Salon / cuisine',inv:['laser','chat','serviette'],f:{laser:true,robe:true,armoire:true,cat:true,catWhite:true,tShaggy:true,bath:true,dressed:true,tHabit:true,serviette:true}}
};
const ROOMCODE={chambre:'REVEIL',couloir:'KIMONO',bain:'PACHA',salon:'CAFE'};
const START={chambre:[205,130],couloir:[40,128],bain:[280,128],salon:[34,130]};

let mode='menu',busy=false,verb=null,pending=null,hover='',bathing=false,skipFn=null,t=0,laserDot=null;
const P={face:1,x:205,y:130,tx:205,ty:130,walk:false,res:null};
const cat={x:150,y:130,tx:150,mode:'walk',timer:0,face:1,freeze:false,chase:0};
const mouse={x:80,flee:false};const mt={x:160,y:132,state:'sleep',face:-1};let vitreOpen=false,juggle=false;const cMouse={on:false,x:0};const barCat={x:104,y:78,jump:0};

/* ---------- pixel helpers ---------- */
const r=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w,h)};
function drawMap(rows,pal,x,y,s,flip){const w=rows[0].length;rows.forEach((row,i)=>{for(let j=0;j<row.length;j++){const c=pal[row[j]];if(c){ctx.fillStyle=c;ctx.fillRect(x+(flip?w-1-j:j)*s,y+i*s,s,s)}}})}

/* Magali, version affinée */
const MPAL={H:'#3a2216',h:'#6a4430',S:'#f4c9aa',s:'#e0a88e',R:'#f09090',W:'#fff',E:'#3d7bd9',L:'#2a1610',M:'#d0607a',K:'#151515',k:'#2c2c2c',P:'#2d3f6b',D:'#3a6fd8',d:'#2a52a8',F:'#0d0d0d'};
const MAG_TOP=["...HHHHHH...","..HhhhhhHH..",".HHhHHHHHHH.",".HHSSSSSSHH.",".HSLLSSLLSH.",".HSWESSEWSH.",".HSSSssSSSH.",".HRSSSSSSRH.",".HHSSMMSSHH.",".HHHSSSSHHH.","HHHHHSSHHHHH","HHKKKKKKKKHH","HSKKKKKKKKSH","HSKkKKKKkKSH",".S.KKKKKK.S.",".S.KKKKKK.S."];
const MAG_DRESS_TOP=MAG_TOP.map((row,i)=>i>=11?row.replace(/K/g,'D').replace(/k/g,'d'):row);
function magRows(step){const dressed=S.f.dressed;let top=dressed?MAG_DRESS_TOP:MAG_TOP;
  const leg=step===1?"..PP...PP...":step===2?"...PP.PP....":"...PP..PP...";
  let bot;
  if(dressed){const sl=leg.replace(/P/g,'S');bot=[".S.DDDDDD.S.","..DDDDDDDD..","..DdDDDDdD..",".DDDDDDDDDD.",".DDDDDDDDDD.",sl,sl,sl,sl,sl,sl,sl.replace(/S/g,'F')]}
  else bot=[".S.PPPPPP.S.","...PPPPPP...",leg,leg,leg,leg,leg,leg,leg,leg,leg.replace(/P/g,'F')];
  if(!dressed)bot.splice(2,0,leg);
  return top.concat(bot)}
const MAG_SIDE_TOP=["...HHHHHH...","..HhhhhhHH..",".HHhHHHHHHH.",".HHHHHSSSSH.",".HHHHSSLLS..",".HHHHSSWES..",".HHHHSSSSSS.",".HHHHSRSSS..",".HHHHSSSMS..",".HHHHHSSS...",".HHHHHSS....","..HHKKKKK...","..HHKKKKK...","..HKKSKKK...","...KKSKKK...","...KKSKKK..."];
function sideRows(step){const dressed=S.f.dressed;const top=dressed?MAG_SIDE_TOP.map((r,i)=>i>=11?r.replace(/K/g,'D'):r):MAG_SIDE_TOP;
  const leg=step===1?"...PP.PP....":step===2?"..PP...PP...":"....PPP.....";let bot;
  if(dressed){const sl=leg.replace(/P/g,'S');bot=["...DSDDD....","...DDDDD....","..DDDDDDD...","..DDDDDDD...",".DDDDDDDDD..",sl,sl,sl,sl,sl,sl,sl.replace(/S/g,'F')]}
  else bot=["...PSPPP....","...PPPPP....",leg,leg,leg,leg,leg,leg,leg,leg,leg,leg.replace(/P/g,'F')];
  return top.concat(bot)}
function drawMag(x,y,s=2,step=0,side=0){const rows=side?sideRows(step):magRows(step);const w=12*s,h=rows.length*s;const ox=Math.round(x-w/2),oy=Math.round(y-h);
  drawMap(rows,MPAL,ox,oy,s,side<0);
  if(S.f.scratch){ctx.fillStyle='#d01020';for(let i=0;i<3;i++)for(let k=0;k<4;k++)ctx.fillRect(ox+(3+i*2)*s+k,oy+(4+k)*s,s,1)}}

const CPAL_R={O:'#e0782a',o:'#a8521a',W:'#fff5e0',k:'#1a1a1a',P:'#ff8aa0'};
const CPAL_W={O:'#f6f2ea',o:'#d6cdbf',W:'#ffffff',k:'#1a1a1a',P:'#ff8aa0'};
const cpal=()=>S.f.catWhite?CPAL_W:CPAL_R;
const CAT_W=["...........O.O","..........OOOO","O.........OkOk","O.OOOOOOOOOOPO",".OOoOoOoOOOOO.","..OOOOOOOOOO..","..OO.OO..OO.OO","..WW.WW..WW.WW"];
const CAT_L=["..............","..............","O.............","O.OOOOOOOOO...",".OOoOoOOOOOO..","..OOOOOOOOOkOk","..OO.OO..OOPOO","..WW.WW..WW.WW"];
const CAT_L2=["..............","..............","O.............","O.OOOOOOOOO...",".OOoOoOOOOOO..","..OOOOOOOOOkOk","..OO.OO..OOOOO","..WW.WW..WW.WW"];
function drawCat(){const rows=cat.mode==='lick'?((t>>3)%2?CAT_L:CAT_L2):CAT_W;let rr=rows;
  if(cat.mode==='walk'||cat.mode==='chase'){if((t>>3)%2)rr=rows.map((x,i)=>i===6?"..O.O.O..O.O.O":i===7?"..W.W.W..W.W.W":x)}
  drawMap(rr,cpal(),Math.round(cat.x-14),Math.round(cat.y-16),2,cat.face<0)}

/* ---------- icônes ---------- */
const ICONS={
 kimono:{p:{W:'#f4f4f4',k:'#111',g:'#bbb'},m:["...WW..WW...","..WWWWWWWW..",".WWWWggWWWW.","WWWWW..WWWWW","WW.WW..WW.WW","...WWggWW...","...kkkkkk...","...WWkkWW...","...WWWWWW...","...WWggWW...","...WWWWWW...","............"]},
 laser:{p:{g:'#9aa0a8',R:'#ff2020',r:'#ff9090'},m:["............","..........r.",".........R..","........gg..",".......ggg..","......ggg...",".....ggg....","....ggg.....","...ggg......","..gg........",".g..........","............"]},
 chat:{p:null,m:[".O........O.",".OO......OO.",".OOO....OOO.",".OOOOOOOOOO.",".OkOOOOOOkO.",".OOOOPPOOOO.",".OOOOOOOOOO.","..OWWWWWWO..","...OOOOOO...","............","............","............"]},
 robe:{p:{D:'#3a6fd8',d:'#2a52a8',g:'#888'},m:[".....gg.....","....g..g....","...DD..DD...","...DDDDDD...","....DDDD....","....DddD....","...DDDDDD...","..DDDDDDDD..","..DDdDDdDD..",".DDDDDDDDDD.",".DDDDDDDDDD.","............"]},
 serviette:{p:{w:'#ffffff',p:'#f0a0b0',g:'#888'},m:["............","gggggggggggg","..pppppppp..","..wwwwwwww..","..wwwwwwww..","..wwwwwwww..","..wwwwwwww..","..wwwwwwww..","..wwwwwwww..","..pppppppp..","............","............"]},
 telephone:{p:{k:'#20202a',b:'#4a6aaa',w:'#cfe0ff'},m:["....kkkk....","....kbbk....","....kbwk....","....kbbk....","....kbbk....","....kbwk....","....kbbk....","....kbbk....","....kkkk....","............","............","............"]},
 clems:{p:{o:'#ff8a1a',O:'#e06a0a',g:'#3a8a40'},m:["............","...g........","..ooo..g....",".oOooo.ooo..",".ooooooOooo.","..ooo.ooooo.","....g..ooo..","...ooo......","..oOooo.....","..ooooo.....","...ooo......","............"]},
 fromage:{p:{y:'#f2c832',d:'#d8a820',o:'#c89818'},m:["............","............","..........y.","........yyy.","......yyyyy.","....yyydyyy.","..yyyyyyyyy.",".yydyyyyydy.",".yyyyyydyyy.",".oooooooooo.","............","............"]},
 coussin:{p:{c:'#d0507a',d:'#9a2a50'},m:["............",".cccccccccc.","cccccccccccc","ccdcccccdccc","cccccccccccc","ccccccdccccc","cccccccccccc","ccdcccccdccc","cccccccccccc",".cccccccccc.","............","............"]}
};
function iconCanvas(id){const c=document.createElement('canvas');c.width=12;c.height=12;const x=c.getContext('2d');const ic=ICONS[id];const pal=id==='chat'?cpal():ic.p;
  ic.m.forEach((row,i)=>{for(let j=0;j<12;j++){const col=pal[row[j]];if(col){x.fillStyle=col;x.fillRect(j,i,1,1)}}});return c}

/* ---------- décors ---------- */
function flame(x,y){const f=(t/7|0)%3;r(x,y+3,3,3,'#ff9a20');r(x+(f===1?1:0),y+(f===2?1:0),2,3,'#ffe060');r(x+1,y+4,1,1,'#fff6c0')}
function glow(x,y,rad,col){const g=ctx.createRadialGradient(x,y,1,x,y,rad);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-rad,y-rad,rad*2,rad*2)}
function door(x,y){r(x-3,y-3,28,72,'#2a1c14');r(x,y,22,66,'#7a5030');r(x+3,y+4,16,24,'#86603a');r(x+3,y+34,16,26,'#86603a');r(x+3,y+33,2,2,'#e0c060')}

function drawChambre(){
 r(0,0,320,100,'#3b2a40');for(let x=0;x<320;x+=16)r(x,0,1,98,'#46324c');
 r(0,98,320,3,'#22161c');r(0,101,320,43,'#4a2f22');for(let y=105;y<144;y+=7)r(0,y,320,1,'#3a2419');for(let y=101,i=0;y<144;y+=7,i++)r((i*53)%320,y,1,7,'#3a2419');
 r(172,12,56,36,'#2a1c14');r(175,15,50,30,'#1d3358');r(199,15,2,30,'#2a1c14');r(175,29,50,2,'#2a1c14');r(180,18,3,1,'#cfd8ff');r(214,22,1,1,'#fff');
 r(15,18,62,6,'#5a3820');r(18,24,56,82,'#6b4428');
 if(!S.f.armoire){r(45,26,2,78,'#4a2c18');[[22,30],[49,30],[22,68],[49,68]].forEach(([a,b])=>r(a,b,20,32,'#7a5030'));r(41,64,2,3,'#e0c060');r(49,64,2,3,'#e0c060')}
 else{r(22,26,48,78,'#1e120a');r(22,32,48,2,'#9a9a9a');r(6,24,12,82,'#7a5030');r(74,24,12,82,'#7a5030');
  r(25,34,8,8,'#c0303c');r(24,42,10,30,'#c0303c');
  if(!S.f.robe){r(36,34,6,8,'#3a6fd8');r(35,42,8,28,'#3a6fd8');r(37,44,4,1,'#2a52a8')}
  r(43,34,7,8,'#2f8a5a');r(42,42,9,26,'#2f8a5a');
  if(!S.f.kimono){r(53,34,13,36,'#f2f2f2');r(58,34,3,10,'#d0d0d0');r(53,52,13,3,'#111')}
  r(24,90,46,10,'#3a2418')}
 r(16,106,4,4,'#3a2418');r(72,106,4,4,'#3a2418');
 r(100,66,34,3,'#5a3820');r(114,56,5,10,'#f0e6d0');r(116,54,1,2,'#222');r(104,60,6,6,'#f0e6d0');r(124,61,5,5,'#f0e6d0');
 if(!S.f.dark){flame(115,47);flame(106,53);flame(125,54)}
 r(150,60,104,32,'#5a3a2a');r(154,64,96,4,'#6e4a36');r(148,88,108,20,'#eeeae0');r(156,80,30,10,'#f8f4ec');r(214,80,30,10,'#f8f4ec');
 r(148,93,108,17,'#b24a6a');r(148,93,108,3,'#d06a88');r(150,108,4,6,'#3a2418');r(250,108,4,6,'#3a2418');
 r(262,90,30,22,'#6b4428');r(264,100,26,1,'#4a2c18');r(276,104,3,2,'#e0c060');r(264,112,3,3,'#3a2418');r(287,112,3,3,'#3a2418');
 r(265,86,13,4,'#a03030');r(265,86,13,1,'#e8e0c8');r(265,89,13,1,'#701818');
 if(!S.f.laser){r(281,87,8,2,'#9aa0a8');r(289,87,1,2,'#ff2020')}
 door(293,37);
 if(!S.f.dark)glow(116,52,130,'rgba(255,170,80,0.20)');
}

const wait=ms=>new Promise(res=>setTimeout(res,ms));

let speech=null;
function say(who,text){if(who==='cat'||who==='matou'){/!!!/.test(text)?SFX.angry():/^Mrrrr\.?$/.test(text)?SFX.purr():SFX.meow()}else if(who==='tv')SFX.tv();queued=null;return new Promise(res=>{speech={who,text};placeSpeech();const tm=setTimeout(done,Math.max(1600,text.length*65));skipFn=done;
  function done(){clearTimeout(tm);speech=null;placeSpeech();skipFn=null;setTimeout(res,150)}})}
function placeSpeech(){if(!speech){speechEl.style.display='none';return}
  const s=speech;speechEl.textContent=s.text;speechEl.style.display='block';
  speechEl.style.color=s.who==='narr'?'var(--narr)':s.who==='cat'?'var(--cat)':s.who==='tv'?'var(--tv)':'var(--mag)';
  let x=160,y=40,anchor='bottom';
  if(mode==='intro'){y=s.who==='narr'?40:95;anchor='middle'}
  else if(s.who==='narr'){y=4;anchor='top'}
  else if(s.who==='matou'){x=mt.x;y=mt.y-22}
  else if(s.who==='cat'){if(S.room==='salon'){x=barCat.x;y=barCat.y-22}else if(S.f.cat){x=P.x;y=P.y-62}else{x=cat.x;y=cat.y-22}}
  else if(s.who==='tub'){x=80;y=24}else if(s.who==='tv'){x=228;y=46}else{x=P.x;y=P.y-62}
  // placement en pixels, toujours entièrement dans l'écran
  speechEl.style.transform='none';speechEl.style.left='0px';speechEl.style.top='0px';
  const sw=stage.clientWidth,sh=stage.clientHeight,bw=speechEl.offsetWidth,bh=speechEl.offsetHeight,m=6;
  const px=x/W*sw,py=y/H*sh;
  let left=px-bw/2,top=anchor==='bottom'?py-bh:anchor==='middle'?py-bh/2:py;
  left=Math.max(m,Math.min(sw-bw-m,left));top=Math.max(m,Math.min(sh-bh-m,top));
  speechEl.style.left=left+'px';speechEl.style.top=top+'px'}

function walkTo(x,y){const R=ROOMS[S.room].walk;P.tx=Math.max(R[0],Math.min(R[1],x));P.ty=Math.max(R[2],Math.min(R[3],y));P.walk=true;
  return new Promise(res=>{if(P.res)P.res();P.res=res})}
async function run(fn){busy=true;const before=JSON.stringify([S.room,S.inv,S.f]);const v=verb;try{await fn()}catch(e){console.error(e)}busy=false;cat.freeze=false;
  const failed=JSON.stringify([S.room,S.inv,S.f])===before;resetVerb();if(failed&&v&&mode==='play'){verb=v;updVerbs()}save();setTimeout(replayQueued,0)}

function spotsNow(){return ROOMS[S.room].spots().filter(h=>!h.vis||h.vis())}
function hitSpot(px,py){const sp=spotsNow();for(let i=sp.length-1;i>=0;i--){const [x,y,w,h]=sp[i].r;if(px>=x&&px<x+w&&py>=y&&py<y+h)return sp[i]}return null}
function toScene(e){const b=cv.getBoundingClientRect();return[(e.clientX-b.left)/b.width*W,(e.clientY-b.top)/b.height*H]}

let queued=null;
function replayQueued(){if(!queued||busy||mode!=='play')return;const q=queued;queued=null;if(performance.now()-q.t<1500)(q.right?onRight:onLeft)(q)}

function onLeft(e){
  if(skipFn){queued={clientX:e.clientX,clientY:e.clientY,right:false,t:performance.now()};skipFn();return}
  if(busy||mode!=='play')return;

  const wt=(pending&&h.wWith)?h.wWith:h.w;run(async()=>{await walkTo(...wt);await act(h)});
}

async function act(h,right){
  const dark=S.room==='chambre'&&S.f.dark&&!['bougie','porte'].includes(h.id);

    return say('mag',"Ça ne marche pas.")}
  if(h.exit&&!right)return h.exit();

/* ---------- boucle ---------- */
function update(){t++;
  if(P.walk){const dx=P.tx-P.x,dy=P.ty-P.y,d=Math.hypot(dx,dy);if(d<1.2){P.x=P.tx;P.y=P.ty;P.walk=false;if(P.res){const f=P.res;P.res=null;f()}}else{P.x+=dx/d*2;P.y+=dy/d*1.4;if(Math.abs(dx)>0.5)P.face=dx>0?1:-1}}
  if(mode==='play'&&S.room==='couloir'&&!S.f.cat&&!cat.freeze){
   if(cat.mode==='walk'||cat.mode==='chase'){const sp=cat.mode==='chase'?3:0.4;const dx=cat.tx-cat.x;
     if(Math.abs(dx)<2){if(cat.mode==='chase')cat.tx=60+Math.random()*170;else{const r0=Math.random();if(r0<.45){cat.mode='lick';cat.timer=160+Math.random()*200}else if(r0<.6){cat.mode='sit';cat.timer=100}else cat.tx=60+Math.random()*170}}
     else{cat.x+=Math.sign(dx)*sp;cat.face=Math.sign(dx)}
     if(cat.mode==='chase'){laserDot=[cat.x+cat.face*16,cat.y-1];if(--cat.chase<=0){cat.mode='walk';laserDot=null}}}
   else if(--cat.timer<=0){cat.mode='walk';cat.tx=60+Math.random()*170}}
  if(mode==='play'&&S.room==='salon'&&!S.f.mouseGone&&t%20===0&&Math.random()<.6)SFX.nibble();
  if(speech)placeSpeech();
}
function render(){
  r(0,0,W,H,'#000');
  if(mode==='menu'){drawMag(160,130,3);return}
  if(mode==='intro'||mode==='end')return;
  ROOMS[S.room].draw();
  const showCat=S.room==='couloir'&&!S.f.cat;
  const step=P.walk?1+((t>>3)%2):0;
  const drawP=()=>{if(!bathing)drawMag(P.x,P.y,2,step,P.walk?P.face:0);
    if(juggle)for(let i=0;i<3;i++){const a=t/9+i*2.09;r(P.x+Math.cos(a)*12-2,P.y-66+Math.sin(a)*8-Math.abs(Math.cos(a))*6,4,4,'#ff8a1a')}};
  if(showCat&&cat.y<P.y){drawCat();drawP()}else{drawP();if(showCat)drawCat()}
  if(laserDot){r(laserDot[0],laserDot[1],2,2,'#ff1010');glow(laserDot[0]+1,laserDot[1]+1,5,'rgba(255,0,0,.5)')}
  if(S.room==='chambre'&&S.f.dark){ctx.fillStyle='rgba(4,2,10,0.93)';ctx.fillRect(0,0,W,H);
    const fl=(t>>4)%2;glow(116,54,7+fl,'rgba(255,90,20,0.55)');r(116,53,1,2,fl?'#ff6020':'#ff9a40');r(116,52,1,1,'#ffd080')}
}

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function noiseBuf(a,d){const b=a.createBuffer(1,Math.max(1,a.sampleRate*d|0),a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;return b}
function noise(d,{type='lowpass',f=1000,q=1,vol=.3,at=0,a=.01,f2}={}){const x=ac();if(!x||muted)return;const t0=x.currentTime+at;const s=x.createBufferSource();s.buffer=noiseBuf(x,d);const fl=x.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t0);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+d);fl.Q.value=q;const g=x.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);s.connect(fl).connect(g).connect(x.destination);s.start(t0);s.stop(t0+d+.05)}
function tone(f,d,{type='square',vol=.12,at=0,f2,a=.01}={}){const x=ac();if(!x||muted)return;const t0=x.currentTime+at;const o=x.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);const g=x.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g).connect(x.destination);o.start(t0);o.stop(t0+d+.05)}
function meow(angry){const x=ac();if(!x||muted)return;const t0=x.currentTime,d=angry?1.0:.55;const o=x.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(angry?520:420,t0);o.frequency.linearRampToValueAtTime(angry?900:720,t0+d*.35);o.frequency.linearRampToValueAtTime(angry?380:360,t0+d);
  const fl=x.createBiquadFilter();fl.type='bandpass';fl.Q.value=4;fl.frequency.setValueAtTime(800,t0);fl.frequency.linearRampToValueAtTime(1800,t0+d*.35);fl.frequency.linearRampToValueAtTime(700,t0+d);
  const g=x.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(angry?.6:.35,t0+.05);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(fl).connect(g).connect(x.destination);o.start(t0);o.stop(t0+d+.05)}
let waterSrc=null;
function water(on){const x=ac();if(!x)return;if(on){if(muted||waterSrc)return;const s=x.createBufferSource();s.buffer=noiseBuf(x,2);s.loop=true;const fl=x.createBiquadFilter();fl.type='bandpass';fl.frequency.value=900;fl.Q.value=.6;const g=x.createGain();g.gain.value=.15;s.connect(fl).connect(g).connect(x.destination);s.start();waterSrc={s,g}}
  else if(waterSrc){const w=waterSrc;waterSrc=null;w.g.gain.setTargetAtTime(0.0001,x.currentTime,.3);w.s.stop(x.currentTime+1.5)}}
const SFX={
 blow:()=>noise(.6,{f:1200,f2:200,vol:.35,a:.05}),
 light:()=>{noise(.15,{type:'highpass',f:2500,vol:.3});noise(.5,{f:400,f2:900,vol:.2,at:.1,a:.1})},
 page:()=>{for(let i=0;i<3;i++)noise(.12,{type:'bandpass',f:3000,q:.8,vol:.25,at:i*.13,f2:5000})},
 pick:()=>{tone(660,.08,{vol:.08});tone(990,.12,{vol:.08,at:.07})},
 door:()=>{noise(.25,{f:300,vol:.3});tone(110,.15,{type:'triangle',vol:.2,at:.2})},
 splash:()=>{noise(.7,{f:2000,f2:300,vol:.45});noise(.4,{type:'bandpass',f:800,vol:.3,at:.25})},
 scratch:()=>{for(let i=0;i<3;i++)noise(.12,{type:'highpass',f:3000,f2:8000,vol:.45,at:.3+i*.15})},
 meow:()=>meow(false),angry:()=>meow(true),
 purr:()=>{for(let i=0;i<10;i++)noise(.08,{f:180,vol:.3,at:i*.1})},
 nibble:()=>noise(.03,{type:'highpass',f:4000,vol:.12}),
 tvOn:()=>{noise(.4,{type:'highpass',f:1500,vol:.25});[523,659,784,1046].forEach((f,i)=>tone(f,.15,{vol:.07,at:.4+i*.14}))},
 tvOff:()=>tone(1200,.1,{type:'sine',f2:80,vol:.15}),
 tv:()=>{for(let i=0;i<5;i++)tone(180+Math.random()*120,.09,{type:'sawtooth',vol:.04,at:i*.11})},
 coffee:()=>{noise(1.2,{type:'bandpass',f:600,q:2,vol:.3,a:.05});for(let i=0;i<8;i++)tone(300+Math.random()*300,.06,{type:'sine',vol:.15,at:1.3+i*.12,f2:600})},
 jump:()=>tone(300,.2,{type:'square',f2:900,vol:.08}),
 scrub:()=>{for(let i=0;i<6;i++)noise(.16,{type:'bandpass',f:1200+(i%2)*800,q:1.5,vol:.3,at:i*.2})},
 squeak:()=>{tone(2200,.06,{type:'sine',vol:.1});tone(2600,.06,{type:'sine',vol:.1,at:.08})}
};
document.addEventListener('pointerdown',()=>ac());
function updSnd(){document.getElementById('sndBtn').textContent='Son : '+(muted?'OFF':'ON')}
document.getElementById('sndBtn').onclick=()=>{muted=!muted;if(muted){water(false);stopMusic()}else if(mode==='intro'||mode==='end')playMusic('lullaby');else roomMusic();try{localStorage.setItem('magali_mute',muted?'1':'0')}catch(e){}updSnd()};updSnd();

/* ---------- musique (synthétisée) ---------- */
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midi(n){const m=n.match(/^([A-G])([#b]?)(-?\d)$/);return 12*(+m[3]+1)+NOTE[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)}
function seq(str,start=0){const out=[];let st=start;str.trim().split(/\s+/).forEach(tok=>{if(tok==='|')return;const [n,d]=tok.split(':');const du=+(d||1);if(n!=='-')out.push([st,midi(n),du]);st+=du});return out}
function mf(m){return 440*Math.pow(2,(m-69)/12)}
function inst(kind,m,t0,d,out){const x=AC;const g=x.createGain();g.connect(out);const f=mf(m);
  const osc=(type,fr,v)=>{const o=x.createOscillator();o.type=type;o.frequency.value=fr;const gg=x.createGain();gg.gain.value=v;o.connect(gg).connect(g);o.start(t0);o.stop(t0+d+1.2)};
  if(kind==='box'){osc('sine',f,1);osc('sine',f*2,.35);osc('sine',f*4,.08);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.5,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d+1)}
  else if(kind==='ep'){osc('sine',f,1);osc('triangle',f*2,.12);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.35,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.4)}
  else if(kind==='flute'){osc('triangle',f,1);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.3,t0+.08);g.gain.setValueAtTime(.3,t0+d*.8);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.15)}
  else if(kind==='bass'){osc('triangle',f,1);osc('sine',f*2,.2);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.55,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.1)}
  else if(kind==='horn'){const lp=x.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;lp.connect(out);g.disconnect();g.connect(lp);osc('sawtooth',f,1);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.18,t0+.05);g.gain.setValueAtTime(.18,t0+d*.7);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.1)}
  else if(kind==='harp'){const lp=x.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.connect(out);g.disconnect();g.connect(lp);osc('sawtooth',f,.6);osc('square',f*2,.15);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.3,t0+.005);g.gain.exponentialRampToValueAtTime(.0001,t0+Math.min(d,.5)+.25)}
  else if(kind==='brush'){const s=x.createBufferSource();s.buffer=noiseBuf(x,.2);const hp=x.createBiquadFilter();hp.type='highpass';hp.frequency.value=5000;s.connect(hp).connect(g);g.gain.setValueAtTime(.25,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.15);s.start(t0);s.stop(t0+.2)}}
function chordVoice(chords,len,pattern,kind,oct=0){const n=[];chords.forEach((c,ci)=>pattern.forEach(([st,idx,du])=>n.push([ci*len+st,c[idx%c.length]+oct,du])));return{kind,notes:n}}
const TRACKS={
 lullaby:{spb:.32,len:48,vol:.5,voices:[
  {kind:'box',notes:seq("E5:1 E5:1 G5:4 E5:1 E5:1 G5:4 E5:1 G5:1 C6:2 B5:3 A5:1 A5:2 G5:2 D5:1 E5:1 F5:2 D5:2 D5:1 E5:1 F5:4 D5:1 F5:1 B5:1 A5:1 G5:2 B5:2 C6:6")},
  {kind:'box',notes:seq("C4:6 G3:6 C4:6 F3:6 G3:6 G3:6 G3:6 C4:6").map(([a,b,c])=>[a,b,c])}]},
 elevator:{spb:.24,len:64,vol:.45,voices:[
  chordVoice([[60,64,67,71],[57,60,64,67],[62,65,69,72],[55,59,62,65],[60,64,67,71],[57,60,64,67],[62,65,69,72],[55,59,62,65]],8,[[0,0,2],[2,1,1],[3,2,2],[5,3,1],[6,1,2]],'ep'),
  {kind:'bass',notes:seq("C3:3 G2:5 A2:3 E2:5 D3:3 A2:5 G2:3 D3:5 C3:3 G2:5 A2:3 E2:5 D3:3 A2:5 G2:3 B2:5")},
  {kind:'flute',notes:seq("E5:4 D5:2 C5:2 C5:4 B4:2 A4:2 A4:3 F5:1 E5:2 D5:2 D5:6 -:2 G5:4 E5:2 C5:2 E5:4 C5:2 A4:2 F5:3 E5:1 D5:2 C5:2 B4:6 -:2")}]},
 jazz:{spb:.2,swing:.06,len:64,vol:.5,voices:[
  {kind:'bass',notes:seq("G2:2 A2:2 Bb2:2 B2:2 C3:2 E3:2 G3:2 Bb2:2 F2:2 A2:2 C3:2 E3:2 D3:2 F#3:2 A3:2 F#3:2 G2:2 Bb2:2 D3:2 Bb2:2 C3:2 G2:2 E2:2 C3:2 F2:2 C3:2 A2:2 F2:2 D3:2 C3:2 A2:2 F#2:2")},
  chordVoice([[58,62,65],[58,64,67],[57,60,64],[54,57,60],[58,62,65],[58,64,67],[57,60,64],[54,57,60]],8,[[3,0,1],[3,1,1],[3,2,1],[7,0,1],[7,1,1],[7,2,1]],'ep'),
  {kind:'brush',notes:Array.from({length:16},(_,i)=>[i*4+2,60,1])},
  {kind:'horn',notes:seq("D5:3 C5:1 Bb4:2 G4:2 E5:3 D5:1 C5:2 Bb4:2 A4:4 C5:2 F5:2 F#5:3 E5:1 D5:4 -:8 -:8 Bb4:2 D5:2 F5:3 E5:1 -:4 C5:2 A4:2 G4:8")}]},
 classic:{spb:.26,len:48,vol:.5,voices:[
  {kind:'harp',notes:seq("D5:2 G4:1 A4:1 B4:1 C5:1 D5:2 G4:2 G4:2 E5:2 C5:1 D5:1 E5:1 F#5:1 G5:2 G4:2 G4:2 C5:2 D5:1 C5:1 B4:1 A4:1 B4:2 C5:1 B4:1 A4:1 G4:1 F#4:2 G4:1 A4:1 B4:1 G4:1 A4:6")},
  {kind:'harp',notes:seq("G3:6 B3:6 C4:6 B3:6 A3:6 G3:6 D4:2 B3:2 G3:2 D3:6")}]}
};
const ROOMMUS={chambre:'elevator',couloir:'elevator',bain:'jazz',salon:'classic'};
let MUS={name:null,out:null,timer:null,next:0,loop:0};
function playMusic(name){if(MUS.name===name&&MUS.out)return;stopMusic();if(muted||!name)return;const x=ac();if(!x)return;const tr=TRACKS[name];
  const out=x.createGain();out.gain.value=0;out.gain.linearRampToValueAtTime(.16*tr.vol,x.currentTime+1);out.connect(x.destination);
  MUS={name,out,next:x.currentTime+.15,timer:null};const dur=tr.len*tr.spb;
  const sched=()=>{if(MUS.out!==out)return;while(MUS.next<x.currentTime+.6){const base=MUS.next;
     tr.voices.forEach(v=>v.notes.forEach(([st,m,du])=>{let tt=base+st*tr.spb;if(tr.swing&&st%2===1)tt+=tr.swing;inst(v.kind,m,tt,du*tr.spb,out)}));MUS.next+=dur}};
  sched();MUS.timer=setInterval(sched,200)}
function stopMusic(){if(MUS.timer)clearInterval(MUS.timer);if(MUS.out&&AC){const o=MUS.out;o.gain.cancelScheduledValues(AC.currentTime);o.gain.setTargetAtTime(0,AC.currentTime,.25);setTimeout(()=>o.disconnect(),1500)}MUS={name:null,out:null,timer:null}}
function roomMusic(){if(mode==='play')playMusic(ROOMMUS[S.room])}

function loop(){update();render();requestAnimationFrame(loop)}

/* ---------- intro ---------- */
async function intro(){mode='intro';busy=true;playMusic('lullaby');updSentence();fadeEl.style.opacity=0;titleEl.style.opacity=0;
  await waitSkip(900);
  await say('narr',"Réveille-toi");
  await say('mag',"Mhh quoi ?");
  await say('narr',"Il est l'or ma seignor... une dure journée nous attend");
  await say('mag',"Arrgg... alors ce rêve de ce jeune homme qui joue aux jeux vidéos avec ses amis n'était... qu'un rêve... je fais vraiment de drôles de rêves en fait !!");
  await say('narr',"C'est exact. Maintenant on se lève parce qu'on a beaucoup de choses à faire !");
  titleEl.innerHTML="A day in the life ...";titleEl.style.opacity=1;await waitSkip(3200);titleEl.style.opacity=0;await wait(1200);
  titleEl.innerHTML="Chapitre 1<small>Une matinée ordinaire... ou pas</small>";titleEl.style.opacity=1;await waitSkip(2800);titleEl.style.opacity=0;await wait(900);
  fadeEl.style.opacity=1;mode='play';S.started=true;S.room='chambre';[P.x,P.y]=START.chambre;P.tx=P.x;P.ty=P.y;await wait(200);await fade(false);
  busy=false;save();updSentence();renderCheck();roomMusic();
  run(async()=>{await say('mag',"Bon. Par quoi je commence ?");await say('narr',"Consulte ta liste, à côté des verbes.");await say('narr',"Astuce : le clic droit examine directement un objet.")});
}

/* ---------- menu ---------- */
function mergeState(d){const s=Object.assign(defState(),d);s.f=Object.assign(defF(),d.f||{});s.f.used=Object.assign({},(d.f&&d.f.used)||{});return s}
function applyCode(code){const c=CODES[code];if(!c)return false;S=defState();S.started=true;S.room=c.room;S.inv=c.inv.slice();Object.assign(S.f,c.f);
  [P.x,P.y]=START[c.room];P.tx=P.x;P.ty=P.y;P.walk=false;return true}
function startPlay(){mt.state=S.f.tMatou?'gone':'sleep';mt.x=160;mode='play';roomMusic();titleEl.style.opacity=0;closeMenu();renderInv();renderCheck();updSentence();save()}
function openMenu(){const inGame=mode==='play';const sv=loadSave();
  const rows=Object.entries(CODES).map(([k,c])=>`<tr><td>${c.label}</td><td><b>${k}</b></td><td>${c.inv.length?c.inv.map(i=>ITEMS[i]).join(', '):'(rien)'}</td></tr>`).join('');
  menuBox.innerHTML=`<h1>A day in the life ...</h1>
   <div class="btns">
    ${inGame?'<button id="mRes">▶ Reprendre</button>':''}
    ${!inGame&&sv?'<button id="mCont">▶ Continuer la partie</button>':''}
    <button id="mNew">★ Nouvelle partie</button>
   </div>
   <h2>Mot de passe</h2>
   <div class="pw"><input id="pwIn" placeholder="CODE" maxlength="12"><button id="pwGo">Valider</button></div><div class="msg" id="pwMsg"></div>
   ${inGame?(()=>{const c=CODES[ROOMCODE[S.room]];return `<p>Code de la pièce actuelle : <b>${ROOMCODE[S.room]}</b><br><span class="note">Inventaire restauré : ${c.inv.length?c.inv.map(i=>ITEMS[i]).join(', '):'(rien)'}</span></p>`})():''}
   <p class="note">La progression est sauvegardée automatiquement dans ce navigateur. Les codes servent de secours si la sauvegarde est effacée.</p>`;
  menuEl.style.display='flex';menuEl.scrollTop=0;
  const g=id=>document.getElementById(id);
  if(g('mRes'))g('mRes').onclick=closeMenu;
  if(g('mCont'))g('mCont').onclick=()=>{S=mergeState(sv);P.x=P.tx=S.x;P.y=P.ty=S.y;startPlay()};
  g('mNew').onclick=()=>{S=defState();renderInv();closeMenu();intro()};
  const tryCode=()=>{const v=g('pwIn').value.trim().toUpperCase();if(applyCode(v)){startPlay();run(()=>say('narr',"Mot de passe accepté. Reprise : "+CODES[v].label+"."))}else g('pwMsg').textContent="Mot de passe inconnu."};
  g('pwGo').onclick=tryCode;g('pwIn').onkeydown=e=>{if(e.key==='Enter')tryCode()};
}
function closeMenu(){menuEl.style.display='none'}
$('menuBtn').onclick=()=>{if(mode==='intro')return;if(busy&&mode==='play')return;if(mode==='end')mode='menu';openMenu()};

renderInv();renderCheck();updVerbs();loop();openMenu();
